<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070a12">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Panel Garmin — NuTracker</title>
<style>
  :root{
    --bg:#070a12; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075);
    --border:rgba(255,255,255,.085); --input:rgba(6,9,16,.6);
    --text:#f3f5fb; --muted:#8f9ab3; --accent:#5eead4; --accent2:#2dd4bf;
    --green:#4ade80; --yellow:#fcd34d; --red:#f87171;
    --sleep:#a78bfa; --strain:#60a5fa; --hrv:#5eead4; --pink:#f9a8d4; --orange:#fb923c;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{
    font-family:var(--font); font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
    color:var(--text); max-width:560px; margin:0 auto; padding:20px 16px 60px;
    background:
      radial-gradient(520px 340px at 90% -60px, rgba(167,139,250,.16), transparent 70%),
      radial-gradient(560px 380px at 6% -40px, rgba(45,212,191,.16), transparent 70%),
      var(--bg);
    background-attachment:fixed; min-height:100vh;
  }
  a{color:inherit; text-decoration:none;}
  .top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .top h1{font-size:20px; font-weight:800; letter-spacing:-.5px;}
  .top h1 small{display:block; font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:0;}
  .iconbtn{
    background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:14px;
    width:40px; height:40px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:active{transform:scale(.94);}
  .datebar{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px;}
  .datebar button{width:34px; height:34px; border-radius:50%; font-size:17px;}
  .datebar .lbl{font-weight:700; font-size:15px; min-width:150px; text-align:center;}

  .card{
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.03) 70%);
    border:1px solid var(--border); border-radius:24px; padding:18px; margin-bottom:14px;
    box-shadow:0 18px 50px -24px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  }
  .card h2{font-size:12px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted); font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
  .card h2 b{color:var(--text); letter-spacing:0; font-size:13px; text-transform:none;}

  /* hero */
  .rings{display:flex; justify-content:space-between; gap:8px;}
  .ringbox{flex:1 1 0; min-width:0; text-align:center;}
  .ringbox svg{width:100%; max-width:120px; height:auto; display:block; margin:0 auto; transform:rotate(-90deg);}
  .ringbox .track{fill:none; stroke:rgba(255,255,255,.08); stroke-width:9;}
  .ringbox .prog{fill:none; stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1);}
  .ringwrap{position:relative; max-width:120px; margin:0 auto;}
  .ringwrap .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ringwrap .num b{font-size:30px; font-weight:800; letter-spacing:-1px; line-height:1;}
  .ringwrap .num small{font-size:11px; color:var(--muted); font-weight:600; margin-top:2px;}
  .ringbox .cap{white-space:nowrap; font-size:10.5px; text-transform:uppercase; letter-spacing:1.1px; font-weight:700; margin-top:10px; color:var(--muted);}
  .verdict{margin-top:16px; padding:12px 14px; border-radius:16px; background:rgba(6,9,16,.45); border:1px solid var(--border); font-size:13.5px; line-height:1.55;}
  .verdict b{font-weight:700;}

  .row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:14px; gap:10px;}
  .row:last-child{border-bottom:none;}
  .row .k{color:var(--muted); font-weight:500;}
  .row .v{font-weight:700; text-align:right;}
  .row small{color:var(--muted); font-weight:500;}
  .bar{height:6px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; margin-top:6px;}
  .bar i{display:block; height:100%; border-radius:99px;}
  .part{padding:10px 0; border-bottom:1px solid var(--border);}
  .part:last-child{border-bottom:none;}
  .part .t{display:flex; justify-content:space-between; font-size:14px;}
  .part .t span:first-child{color:var(--muted);}
  .part .t b{font-weight:700;}

  .tiles{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
  .tile{min-width:0; overflow:hidden; background:rgba(6,9,16,.45); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:11px 10px;}
  .tile .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tile .n{font-size:20px; font-weight:800; margin-top:3px; letter-spacing:-.5px;}
  .tile .n small{font-size:11px; color:var(--muted); font-weight:600; margin-left:2px;}
  .tiles.two{grid-template-columns:repeat(2,minmax(0,1fr));}
  .tiles.four{grid-template-columns:repeat(4,minmax(0,1fr));}
  .tiles.four .n{font-size:17px;}

  .stages{display:flex; height:14px; border-radius:99px; overflow:hidden; gap:2px; margin:6px 0 10px;}
  .stages div{height:100%;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted);}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:middle;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .chip{font-size:11px; font-weight:700; border-radius:99px; padding:4px 10px; border:1px solid var(--border); background:rgba(6,9,16,.5);}
  .chip.EXCELLENT,.chip.GOOD{color:var(--green); border-color:rgba(74,222,128,.3);}
  .chip.FAIR{color:var(--yellow); border-color:rgba(252,211,77,.3);}
  .chip.POOR{color:var(--red); border-color:rgba(248,113,113,.3);}

  svg.chart{width:100%; height:auto; display:block; overflow:visible;}
  .chart text{fill:var(--muted); font-size:9px; font-family:var(--font);}
  .grid line{stroke:rgba(255,255,255,.07); stroke-width:1;}
  .trend h3{font-size:13px; font-weight:700; margin:16px 0 4px; display:flex; justify-content:space-between;}
  .trend h3:first-of-type{margin-top:0;}
  .trend h3 span{color:var(--muted); font-weight:600; font-size:12px;}

  .act{padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .act:last-child{border-bottom:none; padding-bottom:0;}
  .act .h{display:flex; align-items:center; gap:12px;}
  .act .ic{width:42px; height:42px; border-radius:14px; background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0;}
  .act .nm{font-weight:700; font-size:14.5px;}
  .act .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .act .kc{margin-left:auto; text-align:right; font-weight:800; font-size:15px; white-space:nowrap;}
  .act .kc small{display:block; font-size:11px; color:var(--muted); font-weight:600;}
  .act .more{display:none; margin-top:12px;}
  .act.open .more{display:block;}
  .zbar{display:flex; height:10px; border-radius:99px; overflow:hidden; gap:2px; margin-top:12px;}
  .zbar div{height:100%;}

  .state{text-align:center; padding:60px 20px; color:var(--muted); line-height:1.7;}
  .spinner{width:38px; height:38px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.3); color:#fca5a5; border-radius:16px; padding:14px; font-size:13.5px; line-height:1.6;}
  .note{font-size:11.5px; color:var(--muted); line-height:1.6; margin-top:10px;}

  /* alertas, plan, coach */
  .alert{border-radius:20px; padding:14px 16px; margin-bottom:14px; font-size:13.5px; line-height:1.55; border:1px solid;}
  .alert b{display:block; margin-bottom:3px; font-size:14px;}
  .alert.warn{background:rgba(252,211,77,.09); border-color:rgba(252,211,77,.35); color:#fde68a;}
  .alert.danger{background:rgba(248,113,113,.1); border-color:rgba(248,113,113,.4); color:#fca5a5;}
  .plan .ptitle{font-size:22px; font-weight:800; letter-spacing:-.5px;}
  .plan .pdetail{font-size:14px; line-height:1.6; color:var(--text); margin-top:6px;}
  .reasons{margin:12px 0 0 18px; font-size:12.5px; color:var(--muted); line-height:1.7;}
  .coachlog{display:none; flex-direction:column; gap:9px; max-height:340px; overflow-y:auto; margin-bottom:12px;}
  .bub{max-width:90%; padding:10px 13px; border-radius:18px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word;}
  .bub.u{align-self:flex-end; background:linear-gradient(135deg,rgba(45,212,191,.25),rgba(14,165,164,.18)); border:1px solid rgba(94,234,212,.35); border-radius:18px 18px 6px 18px;}
  .bub.a{align-self:flex-start; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:18px 18px 18px 6px;}
  .qchips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .qchip{background:rgba(6,9,16,.5); border:1px solid var(--border); color:var(--accent); border-radius:99px; padding:7px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
  .askbar{display:flex; gap:8px;}
  .askbar input{flex:1; background:var(--input); border:1px solid var(--border); color:var(--text); border-radius:14px; padding:12px; font-size:14px; outline:none; font-family:inherit;}
  .askbar input:focus{border-color:var(--accent2);}
  /* diario */
  .tagrow{display:flex; flex-wrap:wrap; gap:8px;}
  .tag{background:rgba(6,9,16,.5); border:1px solid var(--border); color:var(--muted); border-radius:99px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s;}
  .tag.on{background:rgba(45,212,191,.15); border-color:var(--accent2); color:var(--accent); box-shadow:0 0 14px -4px rgba(45,212,191,.6);}
  /* patrones */
  .ins{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border); font-size:13.5px; line-height:1.5;}
  .ins:last-of-type{border-bottom:none;}
  .ins .ic{font-size:22px; width:30px; text-align:center;}
  .ins small{display:block; color:var(--muted); font-size:11px; margin-top:2px;}
  .ins.good{--c:var(--green);} .ins.bad{--c:var(--red);}
  .ins>div{border-left:3px solid var(--c); padding-left:10px;}
  /* logros */
  .badges{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .badge{background:rgba(6,9,16,.45); border:1px solid rgba(255,255,255,.06); border-radius:16px; padding:11px 4px; text-align:center; opacity:.5; filter:grayscale(.8);}
  .badge .bi{font-size:24px;}
  .badge b{display:block; font-size:10.5px; margin-top:4px; font-weight:700; line-height:1.2;}
  .badge small{display:block; font-size:10px; color:var(--muted); margin-top:2px;}
  .badge.got{opacity:1; filter:none; border-color:rgba(252,211,77,.4); background:rgba(252,211,77,.08); box-shadow:0 0 18px -6px rgba(252,211,77,.6);}
  .hm-head{display:flex; justify-content:space-between; align-items:center; margin:18px 0 8px; font-size:12px; color:var(--muted); font-weight:600;}
  .seg button{background:none; border:1px solid var(--border); color:var(--muted); padding:4px 9px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit; margin-left:-1px;}
  .seg button:first-child{border-radius:99px 0 0 99px;} .seg button:last-child{border-radius:0 99px 99px 0;}
  .seg button.on{background:rgba(45,212,191,.15); color:var(--accent); border-color:var(--accent2); position:relative;}
  .heat{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:4px;}
  .heat i{aspect-ratio:1; border-radius:5px; display:block;}
  /* resumen */
  .weekly{white-space:pre-wrap; font-size:14px; line-height:1.7;}
  .btn{width:100%; margin-top:14px; border:none; border-radius:16px; padding:13px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; color:#021c1a; background:linear-gradient(135deg,#2dd4bf,#0ea5a4); box-shadow:0 10px 30px -10px rgba(45,212,191,.5);}
  .btn:disabled{opacity:.6;}
  /* =============== acabado visual: aurora, vidrio, animaciones =============== */
  body{
    background:
      radial-gradient(600px 420px at 100% -80px, rgba(167,139,250,.22), transparent 70%),
      radial-gradient(560px 400px at -10% -40px, rgba(45,212,191,.2), transparent 70%),
      radial-gradient(500px 360px at 50% 110%, rgba(96,165,250,.12), transparent 70%),
      var(--bg);
    background-attachment:fixed;
  }
  .top{
    position:sticky; top:0; z-index:20; margin:-20px -16px 14px; padding:14px 16px 10px;
    background:linear-gradient(180deg,rgba(7,10,18,.92),rgba(7,10,18,.6)); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .top h1 .gt{
    background:linear-gradient(90deg,#fff,#a7f3e6 60%,#c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .top h1 .em{font-size:19px;}
  .iconbtn{transition:transform .15s, border-color .2s, box-shadow .2s;}
  .iconbtn:hover{border-color:rgba(94,234,212,.5); box-shadow:0 0 18px -4px rgba(94,234,212,.5);}
  .datebar .lbl{font-size:16px; letter-spacing:-.3px;}

  .card{
    position:relative; overflow:hidden;
    animation:rise .55s cubic-bezier(.22,1,.36,1) both;
    transition:transform .25s, border-color .25s;
  }
  .card::before{
    content:""; position:absolute; left:0; right:0; top:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--cc,rgba(94,234,212,.7)),transparent); opacity:.8;
  }
  .card:hover{border-color:rgba(255,255,255,.16);}
  @keyframes rise{from{opacity:0; transform:translateY(16px) scale(.985);} to{opacity:1; transform:none;}}
  #root>*:nth-child(1){animation-delay:.00s;} #root>*:nth-child(2){animation-delay:.06s;} #root>*:nth-child(3){animation-delay:.12s;}
  #root>*:nth-child(4){animation-delay:.18s;} #root>*:nth-child(5){animation-delay:.24s;} #root>*:nth-child(6){animation-delay:.30s;}
  #root>*:nth-child(n+7){animation-delay:.34s;}
  .alert{animation:rise .5s cubic-bezier(.22,1,.36,1) both;}

  /* hero */
  .card.hero{--cc:rgba(167,139,250,.8); padding:22px 14px 18px; border-radius:30px;
    background:
      radial-gradient(260px 160px at 50% 0%, rgba(94,234,212,.12), transparent 70%),
      linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03) 70%);}
  .ringbox .prog{filter:drop-shadow(0 0 8px var(--glow,#fff6)); transition:stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1);}
  .ringwrap .num b{font-size:34px; font-weight:800; letter-spacing:-1.5px; text-shadow:0 0 22px currentColor;}
  .ringbox .cap{margin-top:12px; letter-spacing:1.3px;}
  .verdict{background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(6,9,16,.5)); border-radius:18px;}

  /* colores de acento por tarjeta */
  .card.plan{--cc:rgba(96,165,250,.9); background:linear-gradient(160deg,rgba(96,165,250,.14),rgba(255,255,255,.03) 70%);}
  .card.plan .ptitle{background:linear-gradient(90deg,#fff,#93c5fd); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .card.sleepc{--cc:rgba(167,139,250,.9);}
  .card.coachc{--cc:rgba(45,212,191,.9); background:linear-gradient(160deg,rgba(45,212,191,.12),rgba(255,255,255,.03) 70%);}
  .card.heartc{--cc:rgba(248,113,113,.9);}
  .card.bbc{--cc:rgba(94,234,212,.9);}
  .card.achc{--cc:rgba(252,211,77,.9);}
  .card.weeklyc{--cc:rgba(249,168,212,.9); background:linear-gradient(160deg,rgba(249,168,212,.1),rgba(255,255,255,.03) 70%);}

  .card h2{font-size:11.5px; letter-spacing:1.5px;}
  .tile{transition:transform .2s, background .2s;}
  .tile:hover{transform:translateY(-2px); background:rgba(255,255,255,.07);}
  .tile .n{background:linear-gradient(180deg,#fff,#cbd5e1); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .bar i{box-shadow:0 0 10px -1px currentColor; transition:width 1s cubic-bezier(.22,1,.36,1);}
  .stages div{transition:width 1s cubic-bezier(.22,1,.36,1);}
  .chip,.tag,.qchip{transition:transform .15s, box-shadow .2s, background .2s;}
  .qchip:hover,.tag:hover{transform:translateY(-1px); box-shadow:0 6px 16px -8px rgba(94,234,212,.6);}
  .badge{transition:transform .2s;} .badge.got{animation:pop .6s cubic-bezier(.34,1.56,.64,1) both;}
  .badge.got:hover{transform:translateY(-3px) scale(1.04);}
  @keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:none; opacity:1;}}
  .heat i{transition:transform .15s;} .heat i:hover{transform:scale(1.35);}
  .act{transition:background .2s; border-radius:14px; padding-left:6px; padding-right:6px; margin:0 -6px;}
  .act:hover{background:rgba(255,255,255,.04);}
  .act .ic{background:linear-gradient(135deg,rgba(45,212,191,.2),rgba(167,139,250,.18)); border:1px solid var(--border);}
  .btn{transition:transform .15s, filter .2s, box-shadow .2s;} .btn:hover{filter:brightness(1.08); box-shadow:0 14px 34px -10px rgba(45,212,191,.7);} .btn:active{transform:scale(.98);}
  .bub.a{backdrop-filter:blur(8px);}
  .askbar input{background:rgba(6,9,16,.65);}
  .state .spinner{box-shadow:0 0 24px rgba(94,234,212,.4);}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important;} }
  /* =============== rediseño 2: saludo, resumen, secciones, clima =============== */
  .topwrap{position:sticky; top:0; z-index:20; margin:-20px -16px 12px; padding:14px 16px 8px;
    background:linear-gradient(180deg,rgba(7,10,18,.95),rgba(7,10,18,.7)); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.05);}
  .topwrap .top{position:static; margin:0 0 10px; padding:0; background:none; backdrop-filter:none; -webkit-backdrop-filter:none;}
  .nav{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .nav::-webkit-scrollbar{display:none;}
  .nav button{flex-shrink:0; background:rgba(255,255,255,.05); border:1px solid var(--border); color:var(--muted); border-radius:99px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .2s;}
  .nav button.on{background:linear-gradient(135deg,rgba(45,212,191,.28),rgba(167,139,250,.22)); color:#fff; border-color:rgba(94,234,212,.5); box-shadow:0 0 16px -4px rgba(94,234,212,.55);}
  .sec{scroll-margin-top:120px; display:flex; align-items:center; gap:10px; margin:26px 2px 12px; font-size:13px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:#cbd5e1;}
  .sec:first-child{margin-top:4px;}
  .sec i{flex:1; height:1px; background:linear-gradient(90deg,rgba(255,255,255,.18),transparent);}
  .sec span{font-size:18px; filter:drop-shadow(0 0 8px rgba(94,234,212,.5));}

  .card.hero{background:radial-gradient(300px 190px at 50% -10px, var(--tint,rgba(94,234,212,.16)), transparent 72%), linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03) 70%);}
  .greet{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 4px 16px;}
  .greet small{display:block; font-size:11.5px; color:var(--muted); font-weight:600;}
  .greet b{display:block; font-size:21px; font-weight:800; letter-spacing:-.6px;}
  .wchip{display:none; align-items:center; gap:6px; background:rgba(255,255,255,.07); border:1px solid var(--border); border-radius:99px; padding:7px 13px; font-size:14px; font-weight:700; white-space:nowrap;}
  .strip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:16px;}
  .strip div{background:rgba(6,9,16,.5); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:9px 4px; text-align:center;}
  .strip b{display:block; font-size:16px; font-weight:800; letter-spacing:-.4px;}
  .strip small{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; margin-top:2px;}

  /* clima */
  .card.wx{--cc:rgba(251,191,36,.9); background:linear-gradient(160deg,var(--w1,rgba(96,165,250,.2)),var(--w2,rgba(255,255,255,.03)) 75%);}
  .card.wx.clear{--w1:rgba(251,191,36,.2); --cc:rgba(251,191,36,.9);}
  .card.wx.cloud{--w1:rgba(148,163,184,.2); --cc:rgba(148,163,184,.9);}
  .card.wx.rain{--w1:rgba(59,130,246,.28); --cc:rgba(96,165,250,.9);}
  .wx-main{display:flex; align-items:center; gap:14px;}
  .wx-ic{font-size:52px; line-height:1; filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}

  .wx-hl{margin-left:auto; text-align:right; font-size:14px; font-weight:700; line-height:1.6;}

  .hours{display:flex; gap:6px; overflow-x:auto; margin:16px -4px 0; padding:2px 4px 6px; scrollbar-width:none;}
  .hours::-webkit-scrollbar{display:none;}
  .hours div{flex:0 0 54px; background:rgba(6,9,16,.4); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:8px 0; text-align:center;}
  .hours small{display:block; font-size:10px; color:var(--muted); font-weight:700;}
  .hours span{display:block; font-size:20px; margin:3px 0;}
  .hours b{font-size:14px; font-weight:800;}
  .hours i{display:block; font-style:normal; font-size:9.5px; color:#7cb4ff; font-weight:700; margin-top:1px; min-height:11px;}
  .wxchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
  .wxchips span{background:rgba(6,9,16,.5); border:1px solid var(--border); border-radius:99px; padding:5px 11px; font-size:11.5px; font-weight:600; color:#cbd5e1;}
  .wxbest{margin-top:14px; padding:12px 14px; border-radius:16px; background:rgba(45,212,191,.1); border:1px solid rgba(94,234,212,.3); font-size:13.5px; line-height:1.5;}
  .wxbest b{color:var(--accent);}
</style>
</head>
<body>

<header class="topwrap">
  <div class="top">
    <a class="iconbtn" href="/?home=1" title="Volver a NuTracker">‹</a>
    <h1 style="flex:1;margin-left:12px"><span class="em">⌚</span> <span class="gt">Panel Garmin</span><small id="who">Nico</small></h1>
    <button class="iconbtn" id="btnReload" title="Actualizar">⟳</button>
  </div>
  <nav class="nav" id="nav"></nav>
</header>
<div class="datebar">
  <button class="iconbtn" id="prev">‹</button>
  <div class="lbl" id="dateLbl"></div>
  <button class="iconbtn" id="next">›</button>
</div>

<div id="root"><div class="state"><div class="spinner"></div>Cargando datos de Garmin…</div></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement("div"); d.textContent = String(s == null ? "" : s); return d.innerHTML; };
const pad = n => String(n).padStart(2, "0");
function ds(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function shift(s, n){ const [y,m,d] = s.split("-").map(Number); return ds(new Date(y, m-1, d+n)); }
const todayS = ds(new Date());
let date = (new URLSearchParams(location.search).get("d")) || todayS;
let data = null, seq = 0;

const fmtDay = s => {
  if(s === todayS) return "Hoy";
  if(s === shift(todayS,-1)) return "Ayer";
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("es-CL",{weekday:"short", day:"numeric", month:"short"});
};
const short = s => { const [y,m,d] = s.split("-").map(Number); return d + "/" + m; };
const hm = sec => { const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60); return h + "h " + pad(m) + "m"; };
const clock = ms => new Date(ms).toLocaleTimeString("es-CL",{hour:"2-digit", minute:"2-digit"});
const num = (v, d) => v == null ? "—" : (d ? (Math.round(v*10**d)/10**d).toFixed(d) : Math.round(v).toLocaleString("es-CL"));

const hdr = () => ({"content-type":"application/json", "x-nt-pin": localStorage.getItem("nt_pin") || ""});
const recColor = v => v == null ? "var(--muted)" : v >= 67 ? "var(--green)" : v >= 34 ? "var(--yellow)" : "var(--red)";

/* ---------- gráficos SVG ---------- */
function ring(value, max, color, big, small, cap){
  const R = 42, C = 2 * Math.PI * R;
  const pct = value == null ? 0 : Math.max(0, Math.min(1, value / max));
  return `<div class="ringbox"><div class="ringwrap">
    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="${R}"/>
    <circle class="prog" cx="50" cy="50" r="${R}" stroke="${color}" style="--glow:${color}"
      stroke-dasharray="${C}" stroke-dashoffset="${C}" data-off="${C * (1 - pct)}"/></svg>
    <div class="num"><b style="color:${color}">${big}</b><small>${small}</small></div></div>
    <div class="cap">${cap}</div></div>`;
}

function bars(vals, o){
  o = o || {};
  const W = 320, H = o.h || 90, pl = 4, pb = 16, n = vals.length;
  const mx = o.max || Math.max(1, ...vals.map(v => v || 0));
  const bw = (W - pl*2) / n;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><g class="grid">`;
  [0.5, 1].forEach(f => { const y = (H-pb) - (H-pb-6)*f; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; });
  s += "</g>";
  vals.forEach((v, i) => {
    const h = v == null ? 0 : Math.max(2, (H-pb-6) * Math.min(1, v/mx));
    const x = pl + i*bw + bw*0.16, w = bw*0.68, y = H-pb-h;
    const c = o.color ? (typeof o.color === "function" ? o.color(v, i) : o.color) : "var(--accent)";
    if(v != null) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${c}" opacity="${i === n-1 ? 1 : .75}"/>`;
    if(o.labels && (i === 0 || i === n-1 || i === Math.floor(n/2))) s += `<text x="${x + w/2}" y="${H-3}" text-anchor="middle">${o.labels[i]}</text>`;
  });
  return s + "</svg>";
}

function line(pts, o){
  o = o || {};
  // pts: [[x,y],...] con x numérico; null en y = hueco
  const W = 320, H = o.h || 110, pl = 24, pr = 6, pt = 8, pb = 16;
  const ok = pts.filter(p => p[1] != null);
  if(ok.length < 2) return '<div class="note">Sin datos suficientes.</div>';
  const xs = ok.map(p => p[0]), ys = ok.map(p => p[1]).concat(o.band ? o.band : []);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = o.min != null ? o.min : Math.min(...ys), y1 = o.max != null ? o.max : Math.max(...ys);
  if(y0 === y1){ y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * .1; if(o.min == null) y0 -= pad; if(o.max == null) y1 += pad;
  const X = x => pl + (W-pl-pr) * (x - x0) / Math.max(1, x1 - x0);
  const Y = y => pt + (H-pt-pb) * (1 - (y - y0) / (y1 - y0));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g${o.id||0}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.color}" stop-opacity=".35"/><stop offset="1" stop-color="${o.color}" stop-opacity="0"/></linearGradient></defs><g class="grid">`;
  for(let i = 0; i <= 3; i++){
    const v = y0 + (y1-y0) * i/3, y = Y(v);
    s += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/>`;
  }
  s += "</g>";
  for(let i = 0; i <= 3; i++){ const v = y0 + (y1-y0) * i/3; s += `<text x="0" y="${Y(v)+3}">${Math.round(v)}</text>`; }
  if(o.band) s += `<rect x="${pl}" y="${Y(o.band[1])}" width="${W-pl-pr}" height="${Math.max(2, Y(o.band[0]) - Y(o.band[1]))}" fill="${o.color}" opacity=".10" rx="4"/>`;
  // segmentos continuos
  let seg = [], segs = [];
  pts.forEach(p => { if(p[1] == null){ if(seg.length) segs.push(seg); seg = []; } else seg.push(p); });
  if(seg.length) segs.push(seg);
  segs.forEach(sg => {
    const d = sg.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    if(o.area && sg.length > 1) s += `<path d="${d} L${X(sg[sg.length-1][0]).toFixed(1)} ${H-pb} L${X(sg[0][0]).toFixed(1)} ${H-pb} Z" fill="url(#g${o.id||0})"/>`;
    s += `<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  if(o.dots) ok.forEach(p => s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" fill="${o.color}"/>`);
  (o.ticks || []).forEach(t => s += `<text x="${X(t[0])}" y="${H-3}" text-anchor="middle">${t[1]}</text>`);
  return s + "</svg>";
}

/* ---------- vistas ---------- */
const TYPE = {
  strength_training:["🏋️","Fuerza"], walking:["🚶","Caminata"], running:["🏃","Correr"], cycling:["🚴","Ciclismo"],
  indoor_cardio:["❤️‍🔥","Cardio"], hiking:["🥾","Senderismo"], tennis:["🎾","Tenis"], swimming:["🏊","Natación"],
  yoga:["🧘","Yoga"], elliptical:["🌀","Elíptica"], treadmill_running:["🏃","Cinta"], indoor_cycling:["🚴","Spinning"],
  lap_swimming:["🏊","Natación"], hiit:["🔥","HIIT"], stair_climbing:["🪜","Escaleras"], pilates:["🤸","Pilates"]
};
const ZCOL = ["#94a3b8","#5eead4","#fcd34d","#fb923c","#f87171"];

function verdict(d){
  const r = d.recovery.score, st = d.strain;
  if(r == null) return "Aún no hay suficientes datos de sueño y HRV para este día.";
  let txt, lo, hi;
  if(r >= 67){ txt = "Tu cuerpo está <b style='color:var(--green)'>bien recuperado</b>. Buen día para entrenar fuerte."; lo = 14; hi = 18; }
  else if(r >= 34){ txt = "Recuperación <b style='color:var(--yellow)'>moderada</b>. Entrena, pero controlando la intensidad."; lo = 10; hi = 14; }
  else { txt = "Recuperación <b style='color:var(--red)'>baja</b>. Prioriza descanso y movimiento suave."; lo = 4; hi = 10; }
  return txt + `<br><span style="color:var(--muted)">Esfuerzo sugerido: <b style="color:var(--text)">${lo}–${hi}</b> · llevas <b style="color:var(--text)">${num(st,1)}</b></span>`;
}

function recoveryCard(d){
  const p = d.recovery.parts, rows = [];
  if(p.hrv) rows.push(`<div class="part"><div class="t"><span>HRV nocturna</span><b>${p.hrv.value} ms <small style="color:var(--muted)">(prom. ${p.hrv.weekly})</small></b></div>
    <div class="bar"><i style="width:${p.hrv.score}%;background:${recColor(p.hrv.score)}"></i></div>
    <div class="note" style="margin-top:4px">Rango normal tuyo: ${p.hrv.low}–${p.hrv.high} ms · ${esc(p.hrv.status||"")}</div></div>`);
  if(p.sleep) rows.push(`<div class="part"><div class="t"><span>Calidad de sueño</span><b>${p.sleep.value}</b></div>
    <div class="bar"><i style="width:${p.sleep.value}%;background:${recColor(p.sleep.value)}"></i></div></div>`);
  if(p.rhr) rows.push(`<div class="part"><div class="t"><span>FC en reposo</span><b>${p.rhr.value} lpm <small style="color:var(--muted)">(14 d: ${p.rhr.ref})</small></b></div>
    <div class="bar"><i style="width:${p.rhr.score}%;background:${recColor(p.rhr.score)}"></i></div></div>`);
  if(p.bodyBattery) rows.push(`<div class="part"><div class="t"><span>Body Battery al despertar</span><b>${p.bodyBattery.value}</b></div>
    <div class="bar"><i style="width:${p.bodyBattery.value}%;background:${recColor(p.bodyBattery.value)}"></i></div></div>`);
  return `<div class="card"><h2>Recuperación <b style="color:${recColor(d.recovery.score)}">${d.recovery.score == null ? "—" : d.recovery.score + "%"}</b></h2>${rows.join("") || '<div class="note">Sin datos.</div>'}
    <div class="note">Puntaje estimado por NuTracker: HRV 40 %, sueño 30 %, FC en reposo 15 %, Body Battery 15 %. Garmin no entrega un % de recuperación como Whoop.</div></div>`;
}

const PART_LBL = {totalDuration:"Duración", stress:"Estrés", awakeCount:"Despertares", restlessness:"Inquietud", remPercentage:"REM", lightPercentage:"Ligero", deepPercentage:"Profundo"};
const Q_LBL = {EXCELLENT:"Excelente", GOOD:"Bien", FAIR:"Regular", POOR:"Bajo"};
function sleepCard(d){
  const s = d.sleep;
  if(!s) return `<div class="card"><h2>Sueño</h2><div class="note">No hay un sueño registrado para esta fecha.</div></div>`;
  const tot = (s.deep||0) + (s.light||0) + (s.rem||0) + (s.awake||0) || 1;
  const pc = v => Math.round((v||0) / tot * 100);
  const need = s.needMinutes ? s.needMinutes * 60 : 8 * 3600;
  const ok = Math.min(100, s.seconds / need * 100);
  return `<div class="card sleepc"><h2>Sueño <b style="color:var(--sleep)">${s.score != null ? s.score + " pts" : ""}</b></h2>
    <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:32px;font-weight:800;letter-spacing:-1px">${hm(s.seconds)}</span>
    <span style="color:var(--muted);font-size:13px">de ${hm(need)} necesarias</span></div>
    <div class="bar"><i style="width:${ok}%;background:var(--sleep)"></i></div>
    <div class="note" style="margin:6px 0 12px">${clock(s.start)} → ${clock(s.end)}${s.napSeconds ? " · siesta " + hm(s.napSeconds) : ""}</div>
    <div class="stages">
      <div style="width:${pc(s.deep)}%;background:#6366f1"></div><div style="width:${pc(s.light)}%;background:#60a5fa"></div>
      <div style="width:${pc(s.rem)}%;background:#a78bfa"></div><div style="width:${pc(s.awake)}%;background:#f87171"></div></div>
    <div class="legend"><span><i style="background:#6366f1"></i>Profundo ${hm(s.deep)} · ${pc(s.deep)}%</span><span><i style="background:#60a5fa"></i>Ligero ${hm(s.light)} · ${pc(s.light)}%</span>
      <span><i style="background:#a78bfa"></i>REM ${hm(s.rem)} · ${pc(s.rem)}%</span><span><i style="background:#f87171"></i>Despierto ${hm(s.awake)}</span></div>
    <div class="tiles" style="margin-top:14px">
      <div class="tile"><div class="l">FC media</div><div class="n">${num(s.avgHr)}<small>lpm</small></div></div>
      <div class="tile"><div class="l">Respiración</div><div class="n">${num(s.resp)}<small>rpm</small></div></div>
      <div class="tile"><div class="l">Despertares</div><div class="n">${num(s.awakeCount)}</div></div></div>
    <div class="chips">${s.parts.map(p => `<span class="chip ${esc(p.q)}">${esc(PART_LBL[p.key]||p.key)}${p.value != null ? " " + p.value + "%" : ""} · ${esc(Q_LBL[p.q]||p.q)}</span>`).join("")}</div></div>`;
}

function bodyBatteryCard(d){
  const b = d.bodyBattery;
  const pts = (b.series||[]).map(p => [p[0], p[1]]);
  const t0 = pts.length ? pts[0][0] : 0, t1 = pts.length ? pts[pts.length-1][0] : 1;
  const ticks = pts.length > 1 ? [[t0, clock(t0)], [(t0+t1)/2, clock((t0+t1)/2)], [t1, clock(t1)]] : [];
  return `<div class="card bbc"><h2>Body Battery <b style="color:var(--accent)">${b.now != null ? b.now : "—"}</b></h2>
    ${line(pts, {color:"#5eead4", area:true, min:0, max:100, id:1, ticks, dots:true})}
    <div class="tiles four" style="margin-top:12px">
      <div class="tile"><div class="l">Despertar</div><div class="n">${num(b.wake)}</div></div>
      <div class="tile"><div class="l">Máx</div><div class="n">${num(b.high)}</div></div>
      <div class="tile"><div class="l">Mín</div><div class="n">${num(b.low)}</div></div>
      <div class="tile"><div class="l">Cargó/Gastó</div><div class="n" style="font-size:15px">+${num(b.charged)}/−${num(b.drained)}</div></div></div></div>`;
}

function hrCard(d){
  const h = d.heartRate, pts = (h.series||[]).map(p => [p[0], p[1]]);
  const t0 = pts.length ? pts[0][0] : 0, t1 = pts.length ? pts[pts.length-1][0] : 1;
  const ticks = pts.length > 1 ? [[t0, clock(t0)], [(t0+t1)/2, clock((t0+t1)/2)], [t1, clock(t1)]] : [];
  return `<div class="card heartc"><h2>Frecuencia cardíaca</h2>
    ${line(pts, {color:"#f87171", area:true, id:2, ticks})}
    <div class="tiles" style="margin-top:12px">
      <div class="tile"><div class="l">Reposo</div><div class="n">${num(h.resting)}<small>lpm</small></div></div>
      <div class="tile"><div class="l">Mínima</div><div class="n">${num(h.min)}<small>lpm</small></div></div>
      <div class="tile"><div class="l">Máxima</div><div class="n">${num(h.max)}<small>lpm</small></div></div></div></div>`;
}

function hrvCard(d){
  const h = d.hrv, pts = (h.readings||[]).map(p => [p[0], p[1]]);
  if(!pts.length && h.last == null) return "";
  const t0 = pts.length ? pts[0][0] : 0, t1 = pts.length ? pts[pts.length-1][0] : 1;
  const ticks = pts.length > 1 ? [[t0, clock(t0)], [t1, clock(t1)]] : [];
  return `<div class="card"><h2>HRV <b style="color:var(--hrv)">${num(h.last)} ms</b></h2>
    ${pts.length > 1 ? line(pts, {color:"#5eead4", id:3, band: h.low && h.high ? [h.low, h.high] : null, ticks}) : ""}
    <div class="tiles" style="margin-top:12px">
      <div class="tile"><div class="l">Anoche</div><div class="n">${num(h.last)}</div></div>
      <div class="tile"><div class="l">Semanal</div><div class="n">${num(h.weekly)}</div></div>
      <div class="tile"><div class="l">Normal</div><div class="n" style="font-size:15px">${h.low||"—"}–${h.high||"—"}</div></div></div>
    <div class="note">La banda sombreada es tu rango normal. Estado: ${esc(h.status||"—")}.</div></div>`;
}

function dayCard(d){
  const x = d.day, sp = x.stepGoal ? Math.min(100, (x.steps||0) / x.stepGoal * 100) : 0;
  const im = (x.moderate||0) + 2*(x.vigorous||0), ip = x.intensityGoal ? Math.min(100, im / x.intensityGoal * 100) : 0;
  const sp2 = x.stressPct || {};
  const QS = {calm:"Calmo", balanced:"Equilibrado", stressful:"Estresante", very_stressful:"Muy estresante", CALM:"Calmo", BALANCED:"Equilibrado", STRESSFUL:"Estresante"};
  return `<div class="card"><h2>Actividad del día</h2>
    <div class="part"><div class="t"><span>Pasos</span><b>${num(x.steps)} <small style="color:var(--muted)">/ ${num(x.stepGoal)}</small></b></div><div class="bar"><i style="width:${sp}%;background:var(--accent)"></i></div></div>
    <div class="part"><div class="t"><span>Minutos de intensidad</span><b>${im} <small style="color:var(--muted)">/ ${num(x.intensityGoal)}</small></b></div><div class="bar"><i style="width:${ip}%;background:var(--strain)"></i></div></div>
    <div class="tiles" style="margin-top:12px">
      <div class="tile"><div class="l">Calorías</div><div class="n">${num(x.kcalTotal)}</div></div>
      <div class="tile"><div class="l">Activas</div><div class="n">${num(x.kcalActive)}</div></div>
      <div class="tile"><div class="l">Distancia</div><div class="n">${x.distance != null ? (x.distance/1000).toFixed(1) : "—"}<small>km</small></div></div>
      <div class="tile"><div class="l">Pisos</div><div class="n">${num(x.floors)}</div></div>
      <div class="tile"><div class="l">Respiración</div><div class="n">${num(x.respiration)}<small>rpm</small></div></div>
      <div class="tile"><div class="l">Estrés prom.</div><div class="n">${num(x.stressAvg)}</div></div></div>
    <div class="note" style="margin-top:12px">Estrés: ${esc(QS[x.stressQualifier]||x.stressQualifier||"—")} · máx ${num(x.stressMax)} · reposo ${Math.round(sp2.rest||0)}% · bajo ${Math.round(sp2.low||0)}% · medio ${Math.round(sp2.medium||0)}% · alto ${Math.round(sp2.high||0)}%</div></div>`;
}

function trendCard(d){
  const t = d.trend.slice(-14), lab = t.map(x => short(x.date));
  const last = k => { for(let i = t.length-1; i >= 0; i--) if(t[i][k] != null) return t[i][k]; return null; };
  const avg = k => { const v = t.map(x => x[k]).filter(v => v != null); return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null; };
  const idx = i => i;
  return `<div class="card trend"><h2>Tendencia · ${t.length} días</h2>
    <h3>Recuperación <span>prom. ${num(avg("recovery"))}%</span></h3>${bars(t.map(x => x.recovery), {max:100, color:v => recColor(v), labels:lab})}

    <h3>Sueño <span>prom. ${num(avg("sleepHours"),1)} h</span></h3>${bars(t.map(x => x.sleepHours), {max:10, color:"#a78bfa", labels:lab})}
    <h3>Esfuerzo estimado <span>prom. ${num(avg("strain"),1)}</span></h3>${bars(t.map(x => x.strain), {max:21, color:"#60a5fa", labels:lab})}
    <h3>FC en reposo <span>prom. ${num(avg("rhr"),1)} lpm</span></h3>${line(t.map((x,i) => [i, x.rhr]), {color:"#f87171", dots:true, id:5, ticks:[[0,lab[0]],[Math.floor(t.length/2),lab[Math.floor(t.length/2)]],[t.length-1,lab[t.length-1]]]})}
    <h3>Pasos <span>prom. ${num(avg("steps"))}</span></h3>${bars(t.map(x => x.steps), {color:(v,i) => t[i].stepGoal && v >= t[i].stepGoal ? "#4ade80" : "#5eead4", labels:lab})}
    <h3>Estrés <span>prom. ${num(avg("stress"))}</span></h3>${bars(t.map(x => x.stress), {max:100, color:"#fb923c", labels:lab})}
    <h3>Calorías: comiste vs gastaste <span>${num(avg("kcalIn"))} / ${num(avg("kcalTotal"))} kcal</span></h3>${bars(t.map(x => x.kcalIn), {max:Math.max(...t.map(x => x.kcalTotal||0), 1), color:(v,i) => t[i].kcalTotal && v > t[i].kcalTotal ? "#fb923c" : "#f9a8d4", labels:lab})}
    <div class="note">Rosa: comiste menos de lo que gastaste · naranja: más. Solo cuenta los días con comidas registradas.</div>

let coachMsgs = [], coachBusy = false;
const COACH_Q = ["¿Qué entreno hoy?", "¿Cómo dormí y por qué?", "¿Qué como hoy para recuperarme?", "¿Estoy sobreentrenando?"];
function coachCard(){
  return `<div class="card coachc"><h2>🧠 Pregúntale a tu coach</h2>
    <div id="coachLog" class="coachlog"></div>
    <div class="qchips" id="qchips">${COACH_Q.map(q => `<button class="qchip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
    <div class="askbar"><input id="coachIn" placeholder="Pregunta sobre tu entrenamiento, sueño o comida…"><button class="iconbtn" id="coachSend">➤</button></div></div>`;
}
function drawCoach(){
  const log = $("coachLog"); if(!log) return;
  log.innerHTML = coachMsgs.map(m => `<div class="bub ${m.role === "user" ? "u" : "a"}">${esc(m.text)}</div>`).join("") + (coachBusy ? '<div class="note">pensando…</div>' : "");
  log.style.display = coachMsgs.length || coachBusy ? "flex" : "none";
  log.scrollTop = log.scrollHeight;
}
async function askCoach(text){
  text = (text || "").trim(); if(!text || coachBusy) return;
  coachMsgs.push({role:"user", text}); coachBusy = true; drawCoach();
  try{
    const resp = await fetch("/api/coach-ask", {method:"POST", headers: hdr(), signal: AbortSignal.timeout(70000),
      body: JSON.stringify({messages: coachMsgs.map(m => ({role: m.role, text: m.text})), date})});
    const j = await resp.json().catch(() => ({}));
    if(!resp.ok) throw new Error(j.error || ("Error " + resp.status));
    coachMsgs.push({role:"ai", text: j.text || "No tengo respuesta, intenta de nuevo."});
  }catch(e){ coachMsgs.push({role:"ai", text:"⚠️ " + (e.name === "TimeoutError" ? "La IA tardó demasiado, intenta de nuevo." : (e.message || e))}); }
  coachBusy = false; drawCoach();
}
function bindCoach(){
  drawCoach();
  document.querySelectorAll(".qchip").forEach(b => b.onclick = () => askCoach(b.dataset.q));
  const inp = $("coachIn"); if(!inp) return;
  const go = () => { const v = inp.value; inp.value = ""; askCoach(v); };
  $("coachSend").onclick = go;
  inp.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
}

/* ---------- rachas, medallas y mapa de calor ---------- */
let heatMetric = "recovery";
function streak(trend, ok){ let n = 0; for(let i = trend.length-1; i >= 0; i--){ if(ok(trend[i])) n++; else break; } return n; }
function achievementsCard(d){
  const t = d.trend;
  const ss = streak(t, x => x.sleepHours != null && x.sleepHours >= 7);
  const st = streak(t, x => x.steps != null && x.stepGoal && x.steps >= x.stepGoal);
  const sr = streak(t, x => x.recovery != null && x.recovery >= 67);
  const week = t.slice(-7);
  const trainDays = new Set((d.activities||[]).filter(a => a.start && a.start.slice(0,10) >= week[0].date).map(a => a.start.slice(0,10))).size;
  const stepDays = week.filter(x => x.steps != null && x.stepGoal && x.steps >= x.stepGoal).length;
  const hrvs = t.map(x => x.hrv).filter(v => v != null), todayHrv = t[t.length-1].hrv;
  const hrvRecord = todayHrv != null && hrvs.length >= 14 && todayHrv >= Math.max(...hrvs);
  const B = [
    ["🌙","Dormilón", ss, 3, `${ss} noches seguidas ≥ 7 h`],
    ["😴","Maratón de sueño", ss, 7, `${ss}/7 noches ≥ 7 h`],
    ["👟","Caminante", st, 3, `${st} días seguidos con meta de pasos`],
    ["🚀","Imparable", st, 7, `${st}/7 días con meta de pasos`],
    ["🟢","Cuerpo listo", sr, 3, `${sr} recuperaciones verdes seguidas`],
    ["💪","Constante", trainDays, 3, `${trainDays}/3 días de entreno esta semana`],
    ["🎯","Semana redonda", stepDays, 5, `${stepDays}/5 días con meta de pasos esta semana`],
    ["🏆","Récord de HRV", hrvRecord ? 1 : 0, 1, "tu HRV más alta en 8 semanas"]
  ];
  const badges = B.map(([ic, nm, v, goal, desc]) => `<div class="badge${v >= goal ? " got" : ""}" title="${esc(desc)}"><div class="bi">${ic}</div><b>${nm}</b><small>${v >= goal ? "¡Logrado!" : Math.min(v, goal) + "/" + goal}</small></div>`).join("");
  return `<div class="card achc"><h2>Logros <b>racha de sueño ${ss} · pasos ${st}</b></h2>
    <div class="badges">${badges}</div>
    <div class="hm-head"><span>Últimas 8 semanas</span><span class="seg">${[["recovery","Recuperación"],["sleepScore","Sueño"],["steps","Pasos"]].map(([k,l]) => `<button class="${heatMetric === k ? "on" : ""}" data-hm="${k}">${l}</button>`).join("")}</span></div>
    <div id="heat"></div></div>`;
}
function drawHeat(d){
  const el = $("heat"); if(!el) return;
  const t = d.trend, k = heatMetric;
  const col = (x) => {
    const v = x[k]; if(v == null) return "rgba(255,255,255,.05)";
    if(k === "recovery") return recColor(v);
    if(k === "sleepScore") return v >= 80 ? "var(--green)" : v >= 60 ? "var(--yellow)" : "var(--red)";
    const g = x.stepGoal || 10000; return v >= g ? "var(--green)" : v >= g*.7 ? "var(--yellow)" : "var(--red)";
  };
  const first = new Date(t[0].date + "T12:00:00");
  const pad = (first.getDay() + 6) % 7; // lunes = 0
  const cells = Array(pad).fill(null).concat(t);
  const weeks = Math.ceil(cells.length / 7);
  let html = '<div class="heat" style="grid-template-columns:repeat(' + weeks + ',1fr)">';
  for(let w = 0; w < weeks; w++) for(let r = 0; r < 7; r++){
    const x = cells[w*7 + r];
    html += x ? `<i style="background:${col(x)};opacity:${x[k] == null ? 1 : .88}" title="${x.date}: ${x[k] == null ? "sin datos" : Math.round(x[k])}"></i>` : "<i style='visibility:hidden'></i>";
  }
  el.innerHTML = html + "</div>";
  document.querySelectorAll("[data-hm]").forEach(b => b.onclick = () => { heatMetric = b.dataset.hm; document.querySelectorAll("[data-hm]").forEach(x => x.classList.toggle("on", x === b)); drawHeat(d); });
}

/* ---------- clima de hoy ---------- */
let wx = null, wxAt = 0, wxErr = null;
const wxClass = icon => /☀|🌤|🌙/.test(icon) ? "clear" : /🌧|⛈|🌦|🌨/.test(icon) ? "rain" : "cloud";
const uvTxt = v => v >= 11 ? "extremo" : v >= 8 ? "muy alto" : v >= 6 ? "alto" : v >= 3 ? "moderado" : "bajo";
async function loadWeather(){
  if(!(wx && Date.now() - wxAt < 600000)){
    try{
      const r = await fetch("/api/weather", {headers: hdr()});
      if(r.ok){ wx = await r.json(); wxAt = Date.now(); wxErr = null; }
      else wxErr = r.status === 401 ? "Ingresa el PIN en NuTracker y vuelve." : ((await r.json().catch(() => ({}))).error || ("Error " + r.status));
    }catch(e){ wxErr = "Sin conexión."; }
  }
  drawWeather();
}
function drawWeather(){
  const chip = $("wchip"), slot = $("wxslot");
  const show = wx && date === todayS;
  if(chip){ if(show){ chip.textContent = wx.now.icon + " " + Math.round(wx.now.temp) + "°"; chip.style.display = "flex"; } else chip.style.display = "none"; }
  if(!slot) return;
  if(!wx && date === todayS && wxErr){ slot.innerHTML = `<div class="card"><h2>Clima</h2><div class="note" style="margin:0">No se pudo cargar el clima: ${esc(wxErr)}</div></div>`; return; }
  if(!show){ slot.innerHTML = ""; return; }
  const n = wx.now, t = wx.today, b = wx.best;
  const hrs = wx.hours.filter(h => h.h >= wx.nowHour).slice(0, 16);
  slot.innerHTML = `<div class="card wx ${wxClass(n.icon)}"><h2>Clima · ${esc(wx.place)} <b>${esc(n.text)}</b></h2>
    <div class="wx-main"><div class="wx-ic">${n.icon}</div>
      <div><div class="wx-t">${Math.round(n.temp)}°</div><div class="wx-d">Sensación ${Math.round(n.feels)}° · humedad ${n.humidity}%</div></div>
      <div class="wx-hl">↑ ${Math.round(t.max)}° <span>máxima</span>↓ ${Math.round(t.min)}° <span>mínima</span></div></div>
    <div class="hours">${hrs.map(h => `<div><small>${h.h}h</small><span>${h.icon}</span><b>${Math.round(h.temp)}°</b><i>${h.rain >= 20 ? "💧" + h.rain + "%" : ""}</i></div>`).join("")}</div>
    <div class="wxchips"><span>💧 Lluvia ${t.rain}%</span><span>☀️ UV ${num(t.uv,1)} · ${uvTxt(t.uv)}</span><span>💨 ${Math.round(n.wind)} km/h</span>
      <span>🌅 ${esc(t.sunrise)}</span><span>🌇 ${esc(t.sunset)}</span>${wx.aqi != null ? `<span>🌬️ Aire ${esc((wx.aqiLabel||"").toLowerCase())} (${wx.aqi})</span>` : ""}</div>
    ${b ? `<div class="wxbest">🏃 Mejor ventana para entrenar afuera: <b>${b.from}:00–${b.to}:00</b> · ${b.temp}°${b.rain > 30 ? " · posible lluvia" : " · sin lluvia"}${b.uv >= 6 ? " · usa bloqueador" : ""}</div>` : `<div class="wxbest">🏠 Ya pasó la mejor hora para salir hoy: mejor entrena bajo techo.</div>`}</div>`;
}

/* ---------- saludo, resumen rápido y navegación ---------- */
function greetCard(d){
  const hr = new Date().getHours();
  const hello = hr < 6 ? "Buenas noches" : hr < 12 ? "Buenos días" : hr < 20 ? "Buenas tardes" : "Buenas noches";
  const [y,m,dd] = date.split("-").map(Number);
  const long = new Date(y, m-1, dd).toLocaleDateString("es-CL", {weekday:"long", day:"numeric", month:"long"});
  return `<div class="greet"><div><small>${esc(long.charAt(0).toUpperCase() + long.slice(1))}</small><b>${date === todayS ? hello + ", Nico" : "Resumen del día"}</b></div><div class="wchip" id="wchip"></div></div>`;
}
function stripHtml(d){
  const x = d.day, h = d.hrv, b = d.bodyBattery;
  const it = (v, l) => `<div><b>${v}</b><small>${l}</small></div>`;
  return `<div class="strip">${it(h.last != null ? h.last : "—", "HRV ms")}${it(d.heartRate.resting != null ? d.heartRate.resting : "—", "FC reposo")}${it(b.now != null ? b.now : "—", "Battery")}${it(x.steps != null ? (x.steps >= 1000 ? (x.steps/1000).toFixed(1) + "k" : x.steps) : "—", "Pasos")}</div>`;
}
const SECS = [["s-hoy","☀️","Hoy"],["s-cuerpo","❤️","Cuerpo"],["s-habitos","🧠","Hábitos"],["s-tend","📈","Tendencias"],["s-entreno","🏋️","Entrenos"]];
const sec = (id, ic, nm) => `<div class="sec" id="${id}"><span>${ic}</span>${nm}<i></i></div>`;
function buildNav(){
  $("nav").innerHTML = SECS.map(([id,ic,nm], i) => `<button data-s="${id}" class="${i === 0 ? "on" : ""}">${ic} ${nm}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b => b.onclick = () => { const el = $(b.dataset.s); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); });
}
let spyBound = false;
function bindSpy(){
  if(spyBound) return; spyBound = true;
  window.addEventListener("scroll", () => {
    let cur = SECS[0][0];
    SECS.forEach(([id]) => { const el = $(id); if(el && el.getBoundingClientRect().top < 160) cur = id; });
    document.querySelectorAll("#nav button").forEach(b => {
      const on = b.dataset.s === cur;
      if(on && !b.classList.contains("on")) b.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
      b.classList.toggle("on", on);
    });
  }, {passive:true});
}

function render(){
  $("dateLbl").textContent = fmtDay(date);
  $("next").style.visibility = date >= todayS ? "hidden" : "visible";
  const d = data;
  const r = d.recovery.score, s = d.sleep;
  $("root").innerHTML = `
    <div id="s-hoy" style="scroll-margin-top:120px"></div>
    <div class="card hero" style="--tint:${r == null ? "rgba(94,234,212,.16)" : r >= 67 ? "rgba(74,222,128,.2)" : r >= 34 ? "rgba(252,211,77,.18)" : "rgba(248,113,113,.2)"}">${greetCard(d)}<div class="rings">
      ${ring(r, 100, recColor(r), r == null ? "—" : r, "%", "Recuperación")}
      ${ring(s && s.score, 100, "var(--sleep)", s && s.score != null ? s.score : "—", s ? hm(s.seconds) : "", "Sueño")}
      ${ring(d.strain, 21, "var(--strain)", num(d.strain,1), "de 21", "Esfuerzo")}
    </div>${stripHtml(d)}<div class="verdict">${verdict(d)}</div></div>
    ${alertsCard(d)}<div id="wxslot"></div>${planCard(d)}${coachCard()}
    ${sec("s-cuerpo","❤️","Cuerpo")}${recoveryCard(d)}${sleepCard(d)}${hrvCard(d)}${bodyBatteryCard(d)}${hrCard(d)}${dayCard(d)}
    ${sec("s-habitos","🧠","Hábitos y logros")}${journalCard(d)}${insightsCard(d)}${achievementsCard(d)}${weeklyCard()}
    ${sec("s-tend","📈","Tendencias")}${trendCard(d)}
    ${sec("s-entreno","🏋️","Entrenamientos")}${actCard(d)}
    <div class="note" style="text-align:center">Datos de Garmin Connect · el esfuerzo y la recuperación son estimaciones propias</div>`;
  document.querySelectorAll(".act").forEach(a => a.onclick = () => a.classList.toggle("open"));
  bindCoach(); bindJournal(d); drawHeat(d); bindWeekly(); drawWeather(); bindSpy();
  // los anillos se llenan con animación al aparecer
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll(".ringbox .prog").forEach(c => c.setAttribute("stroke-dashoffset", c.dataset.off))));
}

async function load(){
  const my = ++seq;
  weeklyText = null;
  $("dateLbl").textContent = fmtDay(date);
  $("next").style.visibility = date >= todayS ? "hidden" : "visible";
  $("root").innerHTML = '<div class="state"><div class="spinner"></div>Cargando datos de Garmin…</div>';
  try{
    const resp = await fetch("/api/garmin?date=" + date, {headers: hdr()});
    if(my !== seq) return;
    if(resp.status === 401) throw new Error("Necesitas el PIN de acceso: ábrelo primero desde NuTracker (pantalla principal) y vuelve.");
    const j = await resp.json().catch(() => ({}));
    if(!resp.ok) throw new Error(j.error || ("Error " + resp.status));
    data = j; render();
  }catch(e){
    if(my !== seq) return;
    $("root").innerHTML = '<div class="err">⚠️ ' + esc(e.message || e) + '</div><div class="state"><a class="iconbtn" style="width:auto;padding:0 18px;display:inline-flex" href="/?home=1">Volver</a></div>';
  }
}
buildNav();
$("prev").onclick = () => { date = shift(date, -1); load(); };
$("next").onclick = () => { if(date < todayS){ date = shift(date, 1); load(); } };
$("btnReload").onclick = load;
load();
loadWeather();
})();
</script>
</body>
</html>
