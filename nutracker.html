<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>NuTracker — Calorías con IA</title>
<style>
  :root{
    --bg:#0f1115; --card:#181c24; --card2:#1f2430; --border:#2a3040;
    --text:#e8ecf3; --muted:#8b94a7; --accent:#4ade80; --accent2:#22c55e;
    --prot:#60a5fa; --carb:#fbbf24; --fat:#f472b6; --danger:#f87171;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    max-width:520px; margin:0 auto; padding:16px 16px 120px;
  }
  h1{font-size:20px; font-weight:700; letter-spacing:-0.3px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .iconbtn{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:8px 12px; font-size:16px; cursor:pointer;
  }
  .datebar{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;}
  .datebar button{background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 10px;}
  .datebar .datelabel{font-size:14px; color:var(--text); font-weight:600; min-width:150px; text-align:center;}

  .summary{
    background:linear-gradient(145deg,var(--card),var(--card2));
    border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .kcal-row{display:flex; align-items:baseline; justify-content:center; gap:6px;}
  .kcal-big{font-size:44px; font-weight:800; letter-spacing:-1px;}
  .kcal-goal{color:var(--muted); font-size:15px;}
  .progress{height:8px; background:#0c0e12; border-radius:99px; overflow:hidden; margin:12px 0 16px;}
  .progress>div{height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:99px; transition:width .4s; width:0%;}
  .progress>div.over{background:linear-gradient(90deg,#f59e0b,var(--danger));}
  .macros{display:flex; gap:10px;}
  .macro{flex:1; text-align:center; background:#12151c; border-radius:12px; padding:10px 4px;}
  .macro .val{font-size:17px; font-weight:700;}
  .macro .lbl{font-size:11px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.5px;}
  .macro.p .val{color:var(--prot);} .macro.c .val{color:var(--carb);} .macro.f .val{color:var(--fat);}

  .bigbtns{display:flex; gap:10px; margin-bottom:18px;}
  .btn{
    border:none; border-radius:var(--radius); padding:16px; font-size:16px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{flex:2; background:linear-gradient(135deg,var(--accent2),#15803d); color:#03150a;}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{flex:1; background:var(--card); border:1px solid var(--border); color:var(--text); font-weight:600; font-size:14px;}

  .section-title{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:6px 0 10px;}
  .entry{
    display:flex; align-items:center; gap:12px; background:var(--card);
    border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:10px;
  }
  .entry img{width:52px; height:52px; border-radius:10px; object-fit:cover; background:#0c0e12;}
  .entry .noimg{width:52px; height:52px; border-radius:10px; background:#0c0e12; display:flex; align-items:center; justify-content:center; font-size:22px;}
  .entry .info{flex:1; min-width:0;}
  .entry .name{font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .entry .meta{font-size:12px; color:var(--muted); margin-top:3px;}
  .entry .kcal{font-weight:800; font-size:16px; color:var(--accent); white-space:nowrap;}
  .entry .del{background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:6px;}
  .empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:none;
    align-items:flex-end; justify-content:center; z-index:50; backdrop-filter:blur(3px);
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card); border:1px solid var(--border); border-bottom:none;
    border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:88vh;
    overflow-y:auto; padding:20px; animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
  .sheet h2{font-size:18px; margin-bottom:14px;}
  .sheet label{font-size:13px; color:var(--muted); display:block; margin:12px 0 6px;}
  .sheet input, .sheet textarea{
    width:100%; background:#0c0e12; border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px; font-size:15px;
  }
  .row2{display:flex; gap:10px;}
  .row2>div{flex:1;}
  .sheet .btn{width:100%; margin-top:16px;}
  .closex{float:right; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer;}
  .hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .hint a{color:var(--accent);}

  /* analyze view */
  .preview{width:100%; border-radius:var(--radius); max-height:300px; object-fit:cover; margin-bottom:12px;}
  .spinner{
    width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite; margin:20px auto;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .analyzing{text-align:center; color:var(--muted); font-size:14px; padding:10px 0 20px;}
  .item-row{display:flex; justify-content:space-between; font-size:14px; padding:8px 0; border-bottom:1px solid var(--border);}
  .item-row:last-child{border-bottom:none;}
  .item-row .imacros{color:var(--muted); font-size:12px; margin-top:2px;}
  .conf{font-size:12px; color:var(--muted); margin-top:10px; font-style:italic;}
  .mult{display:flex; gap:8px; margin-top:14px;}
  .mult button{
    flex:1; background:#0c0e12; border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 0; font-size:14px; font-weight:600; cursor:pointer;
  }
  .mult button.sel{border-color:var(--accent); color:var(--accent);}
  .totline{display:flex; justify-content:space-between; font-weight:700; font-size:16px; margin-top:12px;}
  .err{background:#2a1518; border:1px solid #6b2a30; color:#fca5a5; border-radius:12px; padding:12px; font-size:13px; margin-top:12px; line-height:1.5; word-break:break-word;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--accent2); color:#03150a; font-weight:700; padding:12px 22px;
    border-radius:99px; font-size:14px; z-index:99; display:none;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>🥗 NuTracker</h1>
  <button class="iconbtn" id="btnSettings" title="Ajustes">⚙️</button>
</div>

<div class="datebar">
  <button id="prevDay">‹</button>
  <div class="datelabel" id="dateLabel"></div>
  <button id="nextDay">›</button>
</div>

<div class="summary">
  <div class="kcal-row"><span class="kcal-big" id="sumKcal">0</span><span class="kcal-goal">/ <span id="goalKcal">2000</span> kcal</span></div>
  <div class="progress"><div id="progBar"></div></div>
  <div class="macros">
    <div class="macro p"><div class="val" id="sumProt">0 g</div><div class="lbl">Proteína</div></div>
    <div class="macro c"><div class="val" id="sumCarb">0 g</div><div class="lbl">Carbos</div></div>
    <div class="macro f"><div class="val" id="sumFat">0 g</div><div class="lbl">Grasas</div></div>
  </div>
</div>

<div class="bigbtns">
  <button class="btn btn-primary" id="btnPhoto">📸 Foto a mi plato</button>
  <button class="btn btn-ghost" id="btnManual">✏️ Manual</button>
</div>
<input type="file" id="fileInput" accept="image/*" capture="environment" hidden>

<div class="section-title">Comidas del día</div>
<div id="entries"></div>

<!-- ===== Modal: análisis ===== -->
<div class="overlay" id="ovAnalyze">
  <div class="sheet">
    <button class="closex" data-close="ovAnalyze">✕</button>
    <h2>Análisis del plato</h2>
    <img class="preview" id="previewImg" alt="Foto del plato">
    <div id="analyzeBody"></div>
  </div>
</div>

<!-- ===== Modal: manual ===== -->
<div class="overlay" id="ovManual">
  <div class="sheet">
    <button class="closex" data-close="ovManual">✕</button>
    <h2>Agregar manual</h2>
    <label>Nombre</label>
    <input id="mName" placeholder="Ej: Yogurt con granola">
    <div class="row2">
      <div><label>Calorías (kcal)</label><input id="mKcal" type="number" inputmode="numeric" placeholder="0"></div>
      <div><label>Proteína (g)</label><input id="mProt" type="number" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="row2">
      <div><label>Carbos (g)</label><input id="mCarb" type="number" inputmode="numeric" placeholder="0"></div>
      <div><label>Grasas (g)</label><input id="mFat" type="number" inputmode="numeric" placeholder="0"></div>
    </div>
    <button class="btn btn-primary" id="mAdd">Agregar</button>
  </div>
</div>

<!-- ===== Modal: ajustes ===== -->
<div class="overlay" id="ovSettings">
  <div class="sheet">
    <button class="closex" data-close="ovSettings">✕</button>
    <h2>Ajustes</h2>
    <label>API key de Anthropic</label>
    <input id="sKey" type="password" placeholder="sk-ant-...">
    <div class="hint">Se guarda solo en este navegador. Consigue una en <a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a>.</div>
    <label>Meta diaria de calorías</label>
    <input id="sGoal" type="number" inputmode="numeric" placeholder="2000">
    <div class="row2">
      <div><label>Meta proteína (g)</label><input id="sGProt" type="number" inputmode="numeric" placeholder="opcional"></div>
      <div><label>Meta carbos (g)</label><input id="sGCarb" type="number" inputmode="numeric" placeholder="opcional"></div>
    </div>
    <button class="btn btn-primary" id="sSave">Guardar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ================= estado ================= */
const LS = {
  key: "nt_apikey", goal: "nt_goal", gprot: "nt_gprot", gcarb: "nt_gcarb", log: "nt_log"
};
const MOCK = location.hash.includes("mock");
let viewDate = todayStr();
let pending = null;   // resultado de análisis aún no agregado
let pendingImg = null; // dataURL miniatura
let mult = 1;

function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function loadLog(){ try{ return JSON.parse(localStorage.getItem(LS.log)) || {}; }catch(e){ return {}; } }
function saveLog(log){ localStorage.setItem(LS.log, JSON.stringify(log)); }
function getEntries(date){ return loadLog()[date] || []; }
function addEntry(date, entry){
  const log = loadLog();
  (log[date] = log[date] || []).push(entry);
  try{ saveLog(log); }
  catch(e){
    // localStorage lleno: quitar miniaturas viejas y reintentar
    Object.keys(log).forEach(d => { if(d !== date) log[d].forEach(x => delete x.img); });
    try{ saveLog(log); }catch(e2){ entry.img = null; saveLog(log); }
  }
}
function delEntry(date, id){
  const log = loadLog();
  log[date] = (log[date]||[]).filter(e => e.id !== id);
  saveLog(log);
}

/* ================= UI helpers ================= */
const $ = id => document.getElementById(id);
function open(id){ $(id).classList.add("open"); }
function close(id){ $(id).classList.remove("open"); }
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => close(b.dataset.close));
document.querySelectorAll(".overlay").forEach(ov => ov.addEventListener("click", e => { if(e.target === ov) ov.classList.remove("open"); }));
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = "none", 2200);
}
function fmtDate(ds){
  const [y,m,d] = ds.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  if(ds === todayStr()) return "Hoy";
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  if(ds === todayStr(yest)) return "Ayer";
  return dt.toLocaleDateString("es-CL", {weekday:"short", day:"numeric", month:"short"});
}
function esc(s){ const d = document.createElement("div"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }

/* ================= render ================= */
function render(){
  $("dateLabel").textContent = fmtDate(viewDate);
  $("nextDay").style.visibility = viewDate >= todayStr() ? "hidden" : "visible";
  const es = getEntries(viewDate);
  const tot = es.reduce((a,e) => ({k:a.k+e.kcal, p:a.p+e.prot, c:a.c+e.carb, f:a.f+e.fat}), {k:0,p:0,c:0,f:0});
  const goal = Number(localStorage.getItem(LS.goal)) || 2000;
  $("sumKcal").textContent = Math.round(tot.k);
  $("goalKcal").textContent = goal;
  $("sumProt").textContent = Math.round(tot.p) + " g";
  $("sumCarb").textContent = Math.round(tot.c) + " g";
  $("sumFat").textContent = Math.round(tot.f) + " g";
  const pct = Math.min(100, tot.k/goal*100);
  const bar = $("progBar");
  bar.style.width = pct + "%";
  bar.classList.toggle("over", tot.k > goal);

  const wrap = $("entries");
  if(!es.length){
    wrap.innerHTML = '<div class="empty">Nada registrado todavía.<br>Sácale una foto a tu plato 📸</div>';
    return;
  }
  wrap.innerHTML = es.slice().reverse().map(e => `
    <div class="entry">
      ${e.img ? `<img src="${e.img}" alt="">` : `<div class="noimg">🍽️</div>`}
      <div class="info">
        <div class="name">${esc(e.name)}</div>
        <div class="meta">${esc(e.time||"")} · P ${Math.round(e.prot)}g · C ${Math.round(e.carb)}g · G ${Math.round(e.fat)}g</div>
      </div>
      <div class="kcal">${Math.round(e.kcal)}</div>
      <button class="del" data-id="${e.id}" title="Eliminar">🗑</button>
    </div>`).join("");
  wrap.querySelectorAll(".del").forEach(b => b.onclick = () => {
    delEntry(viewDate, Number(b.dataset.id));
    render();
  });
}

/* ================= navegación de fecha ================= */
$("prevDay").onclick = () => { viewDate = shiftDate(viewDate,-1); render(); };
$("nextDay").onclick = () => { viewDate = shiftDate(viewDate, 1); render(); };
function shiftDate(ds, n){
  const [y,m,d] = ds.split("-").map(Number);
  const dt = new Date(y, m-1, d+n);
  return todayStr(dt);
}

/* ================= ajustes ================= */
$("btnSettings").onclick = () => {
  $("sKey").value = localStorage.getItem(LS.key) || "";
  $("sGoal").value = localStorage.getItem(LS.goal) || "";
  $("sGProt").value = localStorage.getItem(LS.gprot) || "";
  $("sGCarb").value = localStorage.getItem(LS.gcarb) || "";
  open("ovSettings");
};
$("sSave").onclick = () => {
  localStorage.setItem(LS.key, $("sKey").value.trim());
  if($("sGoal").value) localStorage.setItem(LS.goal, $("sGoal").value);
  if($("sGProt").value) localStorage.setItem(LS.gprot, $("sGProt").value);
  if($("sGCarb").value) localStorage.setItem(LS.gcarb, $("sGCarb").value);
  close("ovSettings"); toast("Guardado ✓"); render();
};

/* ================= manual ================= */
$("btnManual").onclick = () => { ["mName","mKcal","mProt","mCarb","mFat"].forEach(i => $(i).value=""); open("ovManual"); };
$("mAdd").onclick = () => {
  const name = $("mName").value.trim() || "Comida";
  const kcal = Number($("mKcal").value) || 0;
  if(!kcal){ toast("Ingresa las calorías"); return; }
  addEntry(viewDate, {
    id: Date.now(), name, kcal,
    prot: Number($("mProt").value)||0, carb: Number($("mCarb").value)||0, fat: Number($("mFat").value)||0,
    time: new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}), img: null
  });
  close("ovManual"); toast("Agregado ✓"); render();
};

/* ================= foto + análisis ================= */
$("btnPhoto").onclick = () => {
  if(!MOCK && !(localStorage.getItem(LS.key)||"").trim()){
    toast("Primero configura tu API key");
    $("btnSettings").click();
    return;
  }
  $("fileInput").value = "";
  $("fileInput").click();
};

$("fileInput").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const {big, thumb} = await resizeImage(file);
  pendingImg = thumb;
  $("previewImg").src = big.dataUrl;
  showAnalyzing();
  open("ovAnalyze");
  try{
    const result = MOCK ? await mockAnalyze() : await analyzeWithClaude(big.base64, big.mediaType);
    pending = result; mult = 1;
    showResult();
  }catch(err){
    showError(err);
  }
});

function resizeImage(file){
  return new Promise((resolve,reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const make = (max, q) => {
        const scale = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q);
      };
      const bigUrl = make(1100, .85);
      resolve({
        big: { dataUrl: bigUrl, base64: bigUrl.split(",")[1], mediaType: "image/jpeg" },
        thumb: make(120, .6)
      });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo leer la imagen")); };
    img.src = url;
  });
}

const PROMPT = `Eres un nutricionista experto. Analiza la foto de este plato de comida y estima calorías y macronutrientes.

Responde SOLO con JSON válido, sin texto adicional ni markdown, con esta estructura exacta:
{
  "plato": "nombre corto del plato",
  "items": [
    {"nombre": "alimento", "porcion": "estimación en g o unidades", "kcal": 0, "prot": 0, "carb": 0, "grasa": 0}
  ],
  "total": {"kcal": 0, "prot": 0, "carb": 0, "grasa": 0},
  "confianza": "alta|media|baja",
  "nota": "observación breve sobre la estimación"
}

Reglas: estima porciones por el tamaño visual del plato y objetos de referencia. Los macros en gramos. Si la imagen no muestra comida, responde {"error": "descripción breve"}.`;

async function analyzeWithClaude(base64, mediaType){
  const key = (localStorage.getItem(LS.key)||"").trim();
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 1200,
      messages: [{
        role: "user",
        content: [
          {type: "image", source: {type: "base64", media_type: mediaType, data: base64}},
          {type: "text", text: PROMPT}
        ]
      }]
    })
  });
  if(!resp.ok){
    let msg = "Error " + resp.status;
    try{ const j = await resp.json(); msg += ": " + (j.error && j.error.message || ""); }catch(e){}
    if(resp.status === 401) msg = "API key inválida. Revísala en ⚙️ Ajustes.";
    throw new Error(msg);
  }
  const data = await resp.json();
  const text = (data.content||[]).filter(b => b.type === "text").map(b => b.text).join("");
  return parseResult(text);
}

function parseResult(text){
  let t = text.trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
  const start = t.indexOf("{"), end = t.lastIndexOf("}");
  if(start === -1 || end === -1) throw new Error("La IA no devolvió un resultado válido. Intenta con otra foto.");
  const j = JSON.parse(t.slice(start, end+1));
  if(j.error) throw new Error(j.error);
  if(!j.total || typeof j.total.kcal !== "number") throw new Error("Resultado incompleto de la IA. Intenta de nuevo.");
  j.items = Array.isArray(j.items) ? j.items : [];
  return j;
}

function mockAnalyze(){
  return new Promise(r => setTimeout(() => r({
    plato: "Pollo con arroz y ensalada",
    items: [
      {nombre:"Pechuga de pollo", porcion:"150 g", kcal:248, prot:46, carb:0, grasa:5},
      {nombre:"Arroz blanco", porcion:"180 g", kcal:234, prot:5, carb:51, grasa:1},
      {nombre:"Ensalada mixta", porcion:"80 g", kcal:35, prot:1, carb:5, grasa:1}
    ],
    total: {kcal:517, prot:52, carb:56, grasa:7},
    confianza: "media",
    nota: "Porciones estimadas por tamaño del plato (modo demo)."
  }), 900));
}

/* ================= vistas del modal de análisis ================= */
function showAnalyzing(){
  $("analyzeBody").innerHTML = '<div class="spinner"></div><div class="analyzing">Analizando tu plato con IA…</div>';
}
function showError(err){
  $("analyzeBody").innerHTML = '<div class="err">⚠️ ' + esc(err.message||err) + '</div>' +
    '<button class="btn btn-ghost" style="width:100%;margin-top:14px" onclick="document.getElementById(\'fileInput\').click()">Reintentar con otra foto</button>';
}
function showResult(){
  const r = pending;
  const items = r.items.map(it => `
    <div class="item-row">
      <div>
        <div>${esc(it.nombre)} <span style="color:var(--muted)">· ${esc(it.porcion||"")}</span></div>
        <div class="imacros">P ${round1((it.prot||0)*mult)}g · C ${round1((it.carb||0)*mult)}g · G ${round1((it.grasa||0)*mult)}g</div>
      </div>
      <div style="font-weight:700">${Math.round((it.kcal||0)*mult)} kcal</div>
    </div>`).join("");
  const t = r.total;
  $("analyzeBody").innerHTML = `
    <div style="font-weight:700;font-size:17px;margin-bottom:8px">${esc(r.plato||"Plato")}</div>
    ${items}
    <div style="font-size:13px;color:var(--muted);margin-top:14px">¿Comiste todo el plato? Ajusta la porción:</div>
    <div class="mult" id="multBtns">
      ${[0.5,0.75,1,1.5,2].map(m => `<button data-m="${m}" class="${m===mult?"sel":""}">${m===1?"Todo":"×"+m}</button>`).join("")}
    </div>
    <div class="totline">
      <span>Total</span>
      <span style="color:var(--accent)">${Math.round(t.kcal*mult)} kcal</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px">
      <span>Proteína ${round1(t.prot*mult)}g</span><span>Carbos ${round1(t.carb*mult)}g</span><span>Grasas ${round1(t.grasa*mult)}g</span>
    </div>
    <div class="conf">Confianza: ${esc(r.confianza||"—")}. ${esc(r.nota||"")}</div>
    <button class="btn btn-primary" id="btnAddEntry">Agregar al registro ✓</button>`;
  document.querySelectorAll("#multBtns button").forEach(b => b.onclick = () => { mult = Number(b.dataset.m); showResult(); });
  $("btnAddEntry").onclick = () => {
    const t = pending.total;
    addEntry(viewDate, {
      id: Date.now(), name: pending.plato || "Plato",
      kcal: t.kcal*mult, prot: (t.prot||0)*mult, carb: (t.carb||0)*mult, fat: (t.grasa||0)*mult,
      time: new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"}), img: pendingImg
    });
    pending = null; pendingImg = null;
    close("ovAnalyze"); toast("Agregado ✓"); render();
  };
}
function round1(n){ return Math.round(n*10)/10; }

render();
})();
</script>
</body>
</html>
